# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN - Dashboard RRHH
# ===================================================================

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080
spring.application.name=dashboard-rrhh

# ===================================================================
# EXCEL DATA SOURCE
# ===================================================================
app.excel.file=classpath:data/Dataset_RRHH_Deposito.xlsx

# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.rrhh.dashboard=DEBUG
logging.level.org.springframework.web=INFO

# Formato de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# ACTUATOR (Opcional - para monitoreo)
# ===================================================================
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=always
# ==========================
# H2 Database
# ==========================
spring.datasource.url=jdbc:h2:mem:Dashboard
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
#=================
# PostgreDataBase
#=================
#spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USER}
#spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ==========================
# Consola H2
# ==========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================
# JWT (login de Empleados)
# ==========================
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=60