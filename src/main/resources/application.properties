# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN - Dashboard RRHH
# ===================================================================

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080
spring.application.name=dashboard-rrhh

# ===================================================================
# EXCEL DATA SOURCE
# ===================================================================
app.excel.file=classpath:data/Dataset_RRHH_Deposito.xlsx

# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.rrhh.dashboard=DEBUG
logging.level.org.springframework.web=INFO

# Formato de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# SPRING BOOT ADMIN
# ===================================================================
# Desactivar banner de Spring Boot (opcional)
# spring.main.banner-mode=off

# ===================================================================
# JPA/DATABASE (Desactivado por ahora - no usamos DB todavía)
# ===================================================================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ===================================================================
# ACTUATOR (Opcional - para monitoreo)
# ===================================================================
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=always
