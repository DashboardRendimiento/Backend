# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN - Dashboard RRHH
# ===================================================================

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080
spring.application.name=dashboard-rrhh

# ===================================================================
# EXCEL DATA SOURCE
# ===================================================================
app.excel.file=classpath:data/Dataset_RRHH_Deposito.xlsx

# ===================================================================
# LOGGING
# ===================================================================
logging.level.root=INFO
logging.level.com.rrhh.dashboard=DEBUG
logging.level.org.springframework.web=INFO

# Formato de logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# ACTUATOR (Opcional - para monitoreo)
# ===================================================================
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=always

# ==========================
# Database (PostgreSQL with local H2 Fallback)
# ==========================
spring.datasource.url=${DB_URL:jdbc:h2:mem:Dashboard;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ==========================
# JPA
# ==========================
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ==========================
# Consola H2
# ==========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================
# JWT (login de Empleados)
# ==========================
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=60

# ==========================
# Seed del primer SuperAdmin (solo se crea si no existe ninguno)
# ==========================
app.superadmin.email=${SUPERADMIN_EMAIL:superadmin@example.com}
app.superadmin.password=${SUPERADMIN_PASSWORD:changeme}

# ==========================
# Verificacion facial en el fichaje de Entrada (face-recognition-service)
# ==========================
app.reconocimiento-facial.url=${FACE_SERVICE_URL:http://localhost:8000}
app.reconocimiento-facial.umbral-auto=${FACE_MATCH_THRESHOLD:0.75}

# Subida de fotos (alta de empleado, fichaje de Entrada)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB